[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "browser-history-exporter"
version = "2.0.0"
description = "Cross-platform CLI tool to export browsing history from Chrome, Edge, Brave, Opera, Vivaldi, Chromium, and Firefox (Windows, macOS, Linux)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Browser History Exporter contributors" },
]
keywords = ["browser", "history", "chrome", "firefox", "export", "sqlite", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Utilities",
]
# Standard-library only at runtime - nothing to list here.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
browser-history-exporter = "main:main"

[tool.setuptools]
py-modules = [
    "main",
    "browsers",
    "profiles",
    "chromium",
    "firefox",
    "reader",
    "history_record",
    "exporter",
    "stats",
    "utils",
    "filters",
    "progress",
    "log_setup",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
